services:
  tokat-carsi:
    build: .
    container_name: tokat-dijital-carsi
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tokat-carsi.entrypoints=websecure"
      - "traefik.http.routers.tokat-carsi.rule=Host(`tokat-carsi.srv1779386.hstgr.cloud`)"
      - "traefik.http.routers.tokat-carsi.tls.certresolver=letsencrypt"
      - "traefik.http.services.tokat-carsi.loadbalancer.server.port=80"
    environment:
      - SECRET_KEY=tokat-dijital-carsi-prod-key-2026
